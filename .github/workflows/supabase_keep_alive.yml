name: Supabase Keep-Alive

# This workflow pings your Supabase REST API every 3 days.
# Supabase pauses free-tier projects after 7 days of inactivity.
# This automated ping counts as "activity" and prevents the pause forever.

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://yxqyrjyzxitrgkhgauli.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::warning::SUPABASE_ANON_KEY secret is not configured; skipping keep-alive ping."
            exit 0
          fi

          echo "Pinging Supabase to keep it awake..."
          status=$(curl -sS -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase keep-alive HTTP status: ${status}"
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 500 ]; then
            echo "::error::Supabase keep-alive ping failed with HTTP ${status}."
            exit 1
          fi
          echo "Ping complete!"
