name: Validate timetable backend

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  academic-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements.txt pytest httpx
      - name: Canonical contracts and unapproved mapping quarantine
        run: python -m pytest engine/tests/test_domain.py engine/tests/test_normalized_domain.py engine/tests/test_legacy_mapping.py -q
      - name: engine-api-auth-tests
        run: python -m pytest engine/tests/test_api_auth_and_cors.py -q

  tools-and-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tool/tests -v
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Pure webhook authorization and audience contracts
        run: deno test supabase/functions/send-push/webhook_auth_test.js supabase/functions/send-push/audience_test.js
      - name: edge-invite-admin-tests
        run: deno test supabase/functions/invite-admin/callback_policy_test.js supabase/functions/invite-admin/handler_test.js

  local-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Rebuild and verify isolated local database twice
        # No hosted project, access token, password or repository secret is used.
        run: python tool/task1_local_checks.py --task2

  web-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web test
      - name: Build production bundle (placeholder non-secret env)
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_TIMETABLE_BASE_URL: https://universe-timetable-engine.onrender.com
          VITE_ENABLE_SCHEDULING_PREVIEW_ROUTE: "false"
        run: npm --prefix apps/web run build

  flutter-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags visual_capture
