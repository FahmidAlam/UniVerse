name: Validate timetable backend

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  academic-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Canonical contracts and unapproved mapping quarantine
        run: python -m pytest engine/tests/test_domain.py engine/tests/test_normalized_domain.py engine/tests/test_legacy_mapping.py -q

  tools-and-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tool/tests -v
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Pure webhook authorization and audience contracts
        run: deno test supabase/functions/send-push/webhook_auth_test.js supabase/functions/send-push/audience_test.js

  local-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Rebuild and verify isolated local database twice
        # No hosted project, access token, password or repository secret is used.
        run: python tool/task1_local_checks.py --task2
