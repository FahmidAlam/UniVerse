# ============================================================
# Render Blueprint — one-click deploy of the UniVerse timetable engine.
# In Render: New → Blueprint → pick this repo. It reads this file and
# provisions the service below. The engine lives in the engine/ subdir.
# ============================================================
services:
  - type: web
    name: universe-timetable-engine
    runtime: python
    rootDir: engine
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Keep memory low on the 512 MB free instance (avoids OOM on solve).
      - key: SOLVER_WORKERS
        value: "2"
      # Gradual-to-strict auth mode: "optional" during dual-client rollout, "enforced" for production.
      - key: ENGINE_AUTH_MODE
        value: optional
      # Comma-separated exact browser origins (no trailing slash).
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
