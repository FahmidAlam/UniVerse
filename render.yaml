# ============================================================
# Render Blueprint — one-click deploy of the UniVerse timetable engine.
# In Render: New → Blueprint → pick this repo. It reads this file and
# provisions the service below. The engine lives in the engine/ subdir.
# ============================================================
services:
  - type: web
    name: universe-timetable-engine
    runtime: python
    rootDir: engine
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Keep memory safely under Render's 512 MB free container limit.
      - key: SOLVER_NUM_WORKERS
        value: "1"
      - key: SOLVER_WORKERS
        value: "1"
      - key: SOLVER_MAX_MEMORY_MB
        value: "320"
      - key: SOLVER_LINEARIZATION_LEVEL
        value: "0"
      - key: MAX_CONCURRENT_SOLVES
        value: "1"
      # Gradual-to-strict auth mode: "optional" during dual-client rollout, "enforced" for production.
      - key: ENGINE_AUTH_MODE
        value: optional
      # Comma-separated exact browser origins (no trailing slash).
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
