org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Pub cache (C:) and project (D:) live on different drives; Kotlin's
# incremental compiler can't build a relative path across drive roots
# and crashes the build. Disable it to force a stable full compile.
kotlin.incremental=false
